yookassa:
  shop-id: ${YOOKASSA_SHOP_ID:shop_id}
  secret-key: ${YOOKASSA_TOKEN:token}
  api-url: https://api.yookassa.ru/v3
  return-url: ${YOOKASSA_RETURN_URL:return_url}

services:
  fraud:
    url: ${FRAUD_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics